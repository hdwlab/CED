[project]
name = "ced"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.41.1",
    "einops>=0.6.1",
    "fire>=0.5.0",
    "h5py>=3.8.0",
    "ipykernel>=7.3.0",
    "kaldi-native-fbank>=1.22.3",
    "loguru>=0.6.0",
    "numpy>=1.19.5",
    "onnx>=1.22.0",
    "onnxoptimizer>=0.4.2",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "onnxsim>=0.7.3",
    "packaging>=23.1",
    "pandas>=1.2.0",
    "pytorch-ignite>=0.4.9",
    "pyyaml==6.0.1",
    "safetensors>=0.4.0",
    "scikit-learn==1.3.0",
    "soundfile==0.10.3.post1",
    "torch>=1.8.2",
    "torch-audiomentations==0.11.0",
    "torchaudio>=0.13.0",
    "torchcodec==0.11.1",
    "tqdm>=4.64.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
